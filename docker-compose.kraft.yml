services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      # host clients connect on localhost:9092
      - "9092:9092"
    environment:
      # --- KRaft (no ZooKeeper): this node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # three listeners: internal (containers), external (host), controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: kafka-ui
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8090:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  #     DYNAMIC_CONFIG_ENABLED: "true"

  # --- Conduktor Console: needs a PostgreSQL database for its state ---
  postgresql:
    image: postgres:16
    container_name: conduktor-postgres
    environment:
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor
      POSTGRES_DB: conduktor-console
    volumes:
      - pg_data:/var/lib/postgresql/data

  conduktor-console:
    image: conduktor/conduktor-console:latest
    container_name: conduktor-console
    depends_on:
      - kafka
      - postgresql
    ports:
      # Conduktor UI on http://localhost:8090
      - "8090:8080"
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor@postgresql:5432/conduktor-console"
      # point Conduktor at the broker's INTERNAL listener (inside the network)
      CDK_CLUSTERS_0_ID: "local"
      CDK_CLUSTERS_0_NAME: "local"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"

volumes:
  pg_data:
