services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      # host clients connect on localhost:9092
      - "9092:9092"
    environment:
      # --- KRaft (no ZooKeeper): this node is both broker and controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      # three listeners: internal (containers), external (host), controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # --- Confluent Schema Registry (Avro / Protobuf / JSON Schema) ---
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      # REST API on http://localhost:8081
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # talk to the broker over the INTERNAL listener (inside the network)
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092

  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: kafka-ui
  #   depends_on:
  #     - kafka
  #   ports:
  #     - "8090:8080"
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  #     DYNAMIC_CONFIG_ENABLED: "true"

  # --- Conduktor Console: needs a PostgreSQL database for its state ---
  postgresql:
    image: postgres:16
    container_name: conduktor-postgres
    environment:
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: conduktor
      POSTGRES_DB: conduktor-console
    volumes:
      - pg_data:/var/lib/postgresql/data

  conduktor-console:
    image: conduktor/conduktor-console:latest
    container_name: conduktor-console
    depends_on:
      - kafka
      - postgresql
      - schema-registry
    ports:
      # Conduktor UI on http://localhost:8090
      - "8090:8080"
    environment:
      CDK_DATABASE_URL: "postgresql://conduktor:conduktor@postgresql:5432/conduktor-console"
      # point Conduktor at the broker's INTERNAL listener (inside the network)
      CDK_CLUSTERS_0_ID: "local"
      CDK_CLUSTERS_0_NAME: "local"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      # let Conduktor browse/validate schemas
      CDK_CLUSTERS_0_SCHEMAREGISTRY_URL: "http://schema-registry:8081"

  # --- OpenSearch: sink for the Kafka consumer (Wikimedia -> OpenSearch) ---
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch
    environment:
      # single node -> no cluster discovery needed for local dev
      discovery.type: single-node
      # turn OFF the security plugin so the REST API is plain HTTP with no auth
      # (fine for local dev; the consumer can hit http://localhost:8060 directly)
      DISABLE_SECURITY_PLUGIN: "true"
      # keep the JVM heap small so it fits comfortably on a laptop
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      # OpenSearch requires memory lock and a high mmap count
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # REST API on http://localhost:8060 (container's 9200)
      - "8060:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  # --- OpenSearch Dashboards: UI for browsing the indexed documents ---
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    depends_on:
      - opensearch
    environment:
      # reach OpenSearch over the INTERNAL network (not the host port)
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      # security plugin is disabled on the server, so disable it here too
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      # Dashboards UI on http://localhost:8061 (container's 5601)
      - "8061:5601"

volumes:
  pg_data:
  opensearch_data:
